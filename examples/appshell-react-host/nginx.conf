# Serves one micro-frontend's build output.
#
# Two cache rules, and the split is the whole point.
#
# remoteEntry.js is the address the published manifest names, so it keeps one name
# across every build and must revalidate — a cached one points at chunks that no longer
# exist. Everything else is content-hashed by webpack, so a name identifies its bytes
# and can be cached for a year.
#
# Getting this backwards fails in the worst way available: a browser pairs a fresh entry
# point with a stale chunk and the error surfaces a long way from the deploy.
#
# nginx-unprivileged: runs as a non-root user and writes only under /tmp, which the
# deployment mounts as an emptyDir so readOnlyRootFilesystem holds.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  # All of these live under /tmp because the root filesystem is read-only.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  tcp_nopush    on;
  gzip          on;
  gzip_types    application/javascript application/json text/css text/plain image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Liveness and readiness. Deliberately not a file on disk: a health check that
    # depends on the content being right cannot distinguish "not serving" from
    # "serving the wrong thing", and only the first is worth restarting a pod over.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # The one file whose name is stable across builds, so the only one that must
    # revalidate. It is also what the registry's manifest points at.
    location = /remoteEntry.js {
      add_header Cache-Control 'no-cache' always;
      try_files $uri =404;
    }

    location / {
      # A micro-frontend is loaded by the shell, not navigated to, so there is no SPA
      # fallback here on purpose: a request for a missing chunk must 404 rather than
      # return index.html with a 200, which module federation would try to execute.
      try_files $uri =404;

      # Content-hashed: the name identifies the bytes, so this can never go stale.
      add_header Cache-Control 'public, max-age=31536000, immutable' always;
    }
  }
}
