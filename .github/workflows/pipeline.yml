name: Appshell CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Print current branch
        run: echo "github.ref is ${{ github.ref }}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  publish_npm_packages:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/feat') || contains(github.ref, 'refs/heads/fix') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/$GITHUB_REPOSITORY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY

      - name: Install dependencies
        run: npm ci

      - name: Version and tag pre-release
        if: ${{ contains(github.ref, 'refs/heads/feat') || contains(github.ref, 'refs/heads/fix') }}
        run: npx lerna version --no-push --conventional-prerelease --yes

      - name: Version and tag release
        if: ${{ github.ref == 'refs/heads/main' }}
        run: npx lerna version --no-push --conventional-graduate --yes

      - name: Build
        run: npm run build

      - name: Publish
        run: npx lerna publish --yes from-git
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Push CI commit
        run: git push --follow-tags

  push_docker_images:
    name: Push Docker images to Docker Hub
    needs: publish_npm_packages
    if: ${{ github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/feat') || contains(github.ref, 'refs/heads/fix') }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package-dir: [react-host]

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest
        run: git pull

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get the version
        id: vars
        run: echo "version=$(cat packages/${{ matrix.package-dir }}/package.json | grep \"version\" | sed 's/.*\://' | tr -d '", ')" >> $GITHUB_OUTPUT

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker production image
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          target: production
          platforms: linux/amd64, linux/arm64
          build-args: |
            SOURCE_DIR=packages/${{ matrix.package-dir }}
          tags: |
            ${{ secrets.DOCKER_ORG }}/${{ matrix.package-dir }}:latest
            ${{ secrets.DOCKER_ORG }}/${{ matrix.package-dir }}:${{ steps.vars.outputs.version }}

      - name: Build and push Docker developer image
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          target: developer
          platforms: linux/amd64, linux/arm64
          build-args: |
            SOURCE_DIR=packages/${{ matrix.package-dir }}
          tags: |
            ${{ secrets.DOCKER_ORG }}/${{ matrix.package-dir }}:developer
            ${{ secrets.DOCKER_ORG }}/${{ matrix.package-dir }}:developer-${{ steps.vars.outputs.version }}

      - name: Build and push Docker production release candidate image
        if: ${{ contains(github.ref, 'refs/heads/feat') || contains(github.ref, 'refs/heads/fix') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          target: production
          platforms: linux/amd64, linux/arm64
          build-args: |
            SOURCE_DIR=packages/${{ matrix.package-dir }}
          tags: |
            ${{ secrets.DOCKER_ORG }}/${{ matrix.package-dir }}:${{ steps.vars.outputs.version }}

      - name: Build and push Docker developer release candidate image
        if: ${{ contains(github.ref, 'refs/heads/feat') || contains(github.ref, 'refs/heads/fix') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          target: developer
          platforms: linux/amd64, linux/arm64
          build-args: |
            SOURCE_DIR=packages/${{ matrix.package-dir }}
          tags: |
            ${{ secrets.DOCKER_ORG }}/${{ matrix.package-dir }}:developer-${{ steps.vars.outputs.version }}
